<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar Dados</title>

    <!-- Bootstrap via CDN (deixa o layout bonito) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4 text-center">Formulário de envio</h1>

            <form id="contactForm">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input
                  type="text"
                  id="nome"
                  name="nome"
                  class="form-control"
                  placeholder="Insira seu nome"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="email" class="form-label">Email:</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="nome@exemplo.com"
                  required
                />
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary mb-4">
                  Enviar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/enviarDados.js"></script>
  </body>
</html>
